[package]
name = "ry-flash"
version = "0.1.0"
edition = "2021"
description = "Generic stock-firmware flasher + TUI for RongYuan RY5088 (AT32F405) magnetic keyboards"
license = "MIT"

[[bin]]
name = "ry-flash"
path = "src/main.rs"

[dependencies]
hidapi = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
# cloud firmware fetch (see src/fetch.rs). native-tls so we can accept the vendor's
# invalid cert; zip/flate2 to unpack the firmware package (PK zip or raw DEFLATE).
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
sha2 = "0.10"   # verify a fetched stock image against the published firmware-manifest hash

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
