name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pure host-side logic tests + profile lint. Native gcc + python3 only;
  # no ARM toolchain and no Artery BSP required.
  firmware-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # generator needs 3.11+ (stdlib tomllib)

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Reference host tests
        working-directory: firmware
        run: |
          make test
          make test-wireless

      - name: X65 host tests
        working-directory: firmware
        run: make PROFILE=2268 test

      - name: Profile lint
        working-directory: firmware
        run: make check

  # Cross-compile every board profile with arm-none-eabi-gcc + the Artery BSP.
  firmware-arm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # generator runs as part of each build

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Fetch Artery AT32F402/405 BSP
        run: |
          git clone --depth 1 \
            https://github.com/ArteryTek/AT32F402_405_Firmware_Library \
            firmware/vendor/AT32F402_405_Firmware_Library

      - name: Build every profile
        run: |
          shopt -s nullglob
          built=0
          for p in firmware/profiles/*.toml; do
            id=$(basename "$p" .toml)
            echo "::group::build $id"
            make -C firmware PROFILE="$id"
            echo "::endgroup::"
            built=$((built + 1))
          done
          if [ "$built" -eq 0 ]; then
            echo "no profiles found under firmware/profiles/" >&2
            exit 1
          fi
          echo "built $built profile image(s)"

      - name: Upload X65 experimental firmware
        uses: actions/upload-artifact@v4
        with:
          name: x65-depth-socd-firmware
          path: firmware/build/2268/ry5088_2268_flash.bin
          if-no-files-found: error

  # The ry-flash Rust binary: unit tests + release build.
  flasher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install hidapi / udev dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libhidapi-dev libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Test and build
        working-directory: flasher
        run: |
          cargo test
          cargo build --release

  # Convenience binaries for X65 bring-up on Windows.
  # The depth helpers only toggle the stock firmware's volatile Hall-depth
  # report stream; they do not calibrate, erase, enter bootloader, or flash.
  flasher-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test and build Windows helpers
        working-directory: flasher
        run: |
          cargo test
          cargo build --release

      - name: Upload Windows helpers
        uses: actions/upload-artifact@v4
        with:
          name: ry-flash-windows
          path: |
            flasher/target/release/ry-flash.exe
            flasher/target/release/hid_diag.exe
            flasher/target/release/depth_monitor.exe
            flasher/target/release/depth_snoop.exe
          if-no-files-found: error
